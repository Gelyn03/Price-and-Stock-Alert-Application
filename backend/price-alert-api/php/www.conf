[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data

; ── Process Manager ────────────────────────────────────────
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 200

; ── Timeouts ───────────────────────────────────────────────
request_terminate_timeout = 60s

; ── Logging ────────────────────────────────────────────────
clear_env = no
catch_workers_output = yes